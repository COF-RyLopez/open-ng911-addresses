<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a dispatch-console map. Full-bleed map, the story card on the left, the NENA data model on the right,
   chapter rail along the bottom. One committed dark look, so the map reads like a CAD screen. */
:root {
  color-scheme: dark;
  --ground: #0a1316;      /* map ground and page */
  --panel: #101c20;       /* cards */
  --panel-2: #15252a;
  --line: #24383e;
  --fg: #e4ecee;
  --muted: #8ea2a7;
  --faint: #5d7177;
  --ssap: #f2b441;        /* address points */
  --gers: #3fd0c9;        /* GERS-linked */
  --gap: #e0679b;         /* Overture gap-fill candidates */
  --a2: #a9b9ff;          /* county / census division */
  --a3: #6d82c4;          /* municipalities */
  --up: #ff7a45;          /* upstream: missing elsewhere */
  --ok: #4cc38a;
  --part: #e8b64c;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gers); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
header.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--ground);
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand .eyebrow { font: 500 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.brand h1 { margin: 2px 0 0; font: 800 19px/1.15 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.pilots { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.pilots button {
  border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 5px 10px; cursor: pointer;
  font: 500 12px/1.2 var(--mono); color: var(--muted); display: flex; gap: 6px; align-items: center;
}
.pilots button[aria-pressed="true"] { border-color: var(--fg); color: var(--fg); background: var(--panel-2); }
.pilots button .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.pilots button[data-open="1"] .dot { background: var(--ssap); }

.stage { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; }
.overlay { position: absolute; top: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.overlay > * { pointer-events: auto; }
.left { overflow-y: auto; scrollbar-width: thin; }
.left > .card { flex: 0 0 auto; }
.left { left: max(14px, env(safe-area-inset-left, 0px)); width: min(380px, 34vw); }
.right { right: max(14px, env(safe-area-inset-right, 0px)); width: min(330px, 30vw); }
.card { background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; backdrop-filter: blur(6px); }

.story .chap { font: 500 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.story .chap .layer-tag { color: var(--ground); background: var(--tag, var(--ssap)); padding: 2px 6px; border-radius: 3px; letter-spacing: .04em; }
.story h2 { margin: 10px 0 8px; font: 700 22px/1.15 var(--display); text-wrap: balance; }
.story p { margin: 0 0 10px; color: #c6d3d6; max-width: 62ch; }
.story p:last-child { margin-bottom: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(98px, 1fr)); gap: 12px 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.stat .v { font: 700 20px/1.1 var(--display); font-variant-numeric: tabular-nums; color: var(--c, var(--fg)); }
.stat .l { font-size: 12px; color: var(--muted); margin-top: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }
.legend i.sq { border-radius: 2px; }
.legend i.ln { height: 2px; width: 14px; border-radius: 0; }
.ramp { height: 8px; width: 120px; border-radius: 2px; background: linear-gradient(90deg, #17303a, var(--c)); display: inline-block; }

.model { overflow: auto; min-height: 0; flex: 1 1 auto; }
.model h3 { margin: 0 0 2px; font: 700 14px/1.2 var(--display); letter-spacing: .01em; }
.model .sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.layers { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.layers li { display: grid; grid-template-columns: 54px 1fr auto; gap: 8px; align-items: center; padding: 3px 6px; border-radius: 4px; transition: background .4s; }
.layers li.on { background: var(--panel-2); }
.layers .ind { font: 500 11px/1 var(--mono); color: var(--muted); }
.layers .nm { font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layers .lvl { font-size: 10.5px; color: var(--faint); display: block; }
.chip { font: 500 10.5px/1 var(--mono); padding: 3px 6px; border-radius: 3px; border: 1px solid var(--cc); color: var(--cc); white-space: nowrap; }
.chip.filled { --cc: var(--ok); }
.chip.partial { --cc: var(--part); }
.chip.gap { --cc: var(--faint); }
.chip.agency { --cc: var(--a2); border-style: dashed; }
.chip.lit { background: var(--cc); color: var(--ground); }

.fields { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.fields h4 { margin: 0 0 8px; font: 500 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 3px; }
.f { font: 400 10.5px/1.15 var(--mono); padding: 4px 5px; border-radius: 3px; background: #0d181b; color: var(--faint); border: 1px solid transparent; position: relative; overflow: hidden; transition: color .3s, border-color .3s; }
.f .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--ok); transition: width .6s ease-out; }
.f.filled { color: var(--fg); border-color: #1f3a33; }
.f.partial { color: var(--fg); border-color: #3c3420; }
.f.partial .bar { background: var(--part); }
.f.agency { color: #7f8fc0; border: 1px dashed #2a3557; }
.f.req::after { content: "•"; color: var(--up); position: absolute; right: 4px; top: 2px; }
.fkey { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 11px; color: var(--muted); }

.rail {
  display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); background: var(--ground);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.rail .ctl { display: flex; gap: 6px; }
.rail .ctl button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); cursor: pointer; display: grid; place-items: center; }
.rail .ctl button.play { background: var(--ssap); color: var(--ground); border-color: var(--ssap); }
.rail .ctl svg { width: 14px; height: 14px; fill: currentColor; }
.steps { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.steps button { flex: 1 0 auto; min-width: 74px; background: transparent; border: 0; border-top: 3px solid var(--line); padding: 6px 4px 0; text-align: left; cursor: pointer; color: var(--faint); font: 500 11px/1.2 var(--mono); position: relative; }
.steps button .p { position: absolute; left: 0; top: -3px; height: 3px; width: 0; background: var(--ssap); }
.steps button.done { border-top-color: #5b4a22; color: var(--muted); }
.steps button.cur { color: var(--fg); }
.steps button .n { display: block; font-size: 10px; color: var(--faint); }

.pop { position: absolute; z-index: 5; min-width: 230px; max-width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 12px; pointer-events: auto; box-shadow: 0 8px 24px rgba(0,0,0,.4); transform: translate(-50%, calc(-100% - 12px)); }
.pop h5 { margin: 0 0 6px; font: 600 13px/1.25 var(--body); }
.pop dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.pop dt { font: 400 10.5px/1.4 var(--mono); color: var(--muted); }
.pop dd { margin: 0; font: 400 10.5px/1.4 var(--mono); word-break: break-all; }
.pop .x { position: absolute; right: 6px; top: 4px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
.pop .tag { display: inline-block; font: 500 10px/1 var(--mono); padding: 2px 5px; border-radius: 3px; background: var(--c); color: var(--ground); margin-bottom: 6px; }

.recordcard dl { margin: 10px 0 0; display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 3px 10px; }
.recordcard dl.ids { grid-template-columns: auto 1fr; }
.recordcard dl + dl { margin-top: 6px; }
.recordcard dt { font: 400 10.5px/1.5 var(--mono); color: var(--muted); }
.recordcard dd { margin: 0; font: 400 10.5px/1.5 var(--mono); word-break: break-all; opacity: 0; transform: translateX(-4px); transition: opacity .25s, transform .25s; }
.recordcard dd.in { opacity: 1; transform: none; }
.recordcard dd.hl { color: var(--gers); }
.recordcard .hd { font: 500 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.recordcard .addr { font: 600 15px/1.3 var(--body); margin-top: 4px; }

.pulse { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 2px solid var(--gers); pointer-events: none; z-index: 4; animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.5); opacity: 1 } 100% { transform: scale(1.8); opacity: 0 } }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 500 12px var(--mono); z-index: 6; background: var(--ground); transition: opacity .4s; }
.loading.gone { opacity: 0; pointer-events: none; }
.foot { font-size: 11px; color: var(--faint); }
.foot a { color: var(--muted); }

@media (max-width: 860px) {
  .app { height: auto; min-height: 100%; }
  .stage { display: flex; flex-direction: column; }
  #map { position: relative; height: 58vh; min-height: 320px; }
  .overlay { position: static; width: auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); margin-top: 10px; }
  .left, .right { width: auto; }
  .rail { position: sticky; bottom: 0; z-index: 7; }
  .pilots { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .pulse { animation: none; }
  .f .bar, .recordcard dd { transition: none; }
}
/* Map control styles (subset of maplibre-gl.css; external stylesheets are blocked here) */
.maplibregl-map { overflow: hidden; position: relative; -webkit-tap-highlight-color: transparent; }
.maplibregl-canvas { left: 0; position: absolute; top: 0; }
.maplibregl-canvas-container.maplibregl-interactive { cursor: grab; }
.maplibregl-ctrl-bottom-right { position: absolute; right: 0; bottom: 0; z-index: 2; pointer-events: none; }
.maplibregl-ctrl-top-right { position: absolute; right: 0; top: 0; z-index: 2; pointer-events: none; }
.maplibregl-ctrl { pointer-events: auto; clear: both; }
.maplibregl-ctrl-attrib { display: none; }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">open-ng911-addresses · Phase 1 pilots</span>
      <h1>What the pipeline delivers to a 9-1-1 authority</h1>

      <button id="play" class="play" aria-label="Play the story"><svg viewBox="0 0 16 16" id="playicon"><path d="M4 2v12l10-6z"/></svg></button>
      <button id="next" aria-label="Next chapter"><svg viewBox="0 0 16 16"><path d="m5.5 2 6 6-6 6z"/></svg></button>
    </div>

  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script>
"use strict";
const PILOTS = [
  { job: "ca-pe", label: "PEI", name: "Prince Edward Island", unit: "census division", country: "CA" },
  { job: "us-vt", label: "VT", name: "Vermont", unit: "county", country: "US" },
  { job: "us-me", label: "ME", name: "Maine", unit: "county", country: "US" },
  { job: "us-ut", label: "UT", name: "Utah", unit: "county", country: "US" },
  { job: "us-nd", label: "ND", name: "North Dakota", unit: "county", country: "US" },
];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = { ground: css("--ground"), ssap: css("--ssap"), gers: css("--gers"), gap: css("--gap"), a2: css("--a2"), a3: css("--a3"), up: css("--up"), fg: css("--fg"), line: css("--line") };
const fmt = n => (n == null ? "–" : Number(n).toLocaleString("en-US"));
const pct = (a, b) => (b ? (100 * a / b).toFixed(a / b > 0.995 && a !== b ? 1 : 0) + "%" : "–");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* NENA-STA-006.3 SiteStructureAddressPoint fields (NENA911/NG911GISDataModel, Apache-2.0), in schema order.
   "agency": values only the 9-1-1 authority can supply (we never invent them, ADR 0004). */
const SSAP_FIELDS = ["DiscrpAgID","DateUpdate","Effective","Expire","NGUID","Country","A1","A2","AddCode","A3","A4","A5",
  "AddNum_Pre","Add_Number","AddNum_Suf","AddNum_Cmp","DistMarker","St_PreMod","St_PreDir","St_PreTyp","St_PreSep",
  "St_Name","St_PosTyp","St_PosDir","St_PosMod","LSt_PreDir","LSt_Name","LSt_Typ","LSt_PosDir","ESN","MSAGComm",
  "LCountyID","Post_Comm","Post_Code","PostCodeEx","Site","SubSite","Structure","Floor","FloorIndex","Wing","Unit",
  "UnitPreTyp","UnitValue","Section","Row","Room","Seat","LocMarker","Addtl_Loc","AddDataURI","Place_Type",
  "Placement","Longitude","Latitude","Elevation","Altitude","Height"];
const SSAP_REQ = new Set(["DiscrpAgID","DateUpdate","NGUID","Country","A1"]);
const SSAP_NOT_US = new Set(["AddCode","Unit"]), SSAP_NOT_CA = new Set(["PostCodeEx","UnitPreTyp","UnitValue"]);
const AGENCY = new Set(["ESN","MSAGComm","LCountyID","AddCode","LSt_PreDir","LSt_Name","LSt_Typ","LSt_PosDir","AddDataURI"]);
const RCL_FIELDS = ["DiscrpAgID","DateUpdate","Effective","Expire","NGUID","AdNumPre_L","AdNumPre_R","FromAddr_L","ToAddr_L",
  "FromAddr_R","ToAddr_R","Parity_L","Parity_R","St_PreMod","St_PreDir","St_PreTyp","St_PreSep","St_Name","St_PosTyp",
  "St_PosDir","St_PosMod","Dir_Travel","LSt_PreDir","LSt_Name","LSt_Typ","LSt_PosDir","ESN_L","ESN_R","MSAGComm_L",
  "MSAGComm_R","LCntyID_L","LCntyID_R","Country_L","Country_R","A1_L","A1_R","A2_L","A2_R","A3_L","A3_R","A4_L","A4_R",
  "A5_L","A5_R","PostCode_L","PostCode_R","PostComm_L","PostComm_R","RoadClass","OneWay","SpeedLimit","Valid_L","Valid_R"];
const RCL_REQ = new Set(["DiscrpAgID","DateUpdate","NGUID","FromAddr_L","ToAddr_L","FromAddr_R","ToAddr_R","Parity_L","Parity_R","St_Name","Country_L","Country_R","A1_L","A1_R"]);
const RCL_AGENCY = new Set(["ESN_L","ESN_R","MSAGComm_L","MSAGComm_R","LCntyID_L","LCntyID_R","LSt_PreDir","LSt_Name","LSt_Typ","LSt_PosDir","Valid_L","Valid_R"]);
const FIELD_ALIAS = { nguid: "nguid", rcl_nguid: "nguid" };

/* The NENA layer list, with what a Phase 1 Package carries (docs/standards/gap-review.md). */
const LAYERS = [
  { id: "SSAP", name: "SiteStructureAddressPoint", lvl: "Required" },
  { id: "RCL", name: "RoadCenterLine", lvl: "Required" },
  { id: "A1", name: "A1Polygon (state / province)", lvl: "Strongly rec." },
  { id: "A2", name: "A2Polygon (county / CD)", lvl: "Strongly rec." },
  { id: "A3", name: "A3Polygon (municipality)", lvl: "Strongly rec." },
  { id: "Prov", name: "ProvisioningPolygon", lvl: "Required" },
  { id: "PSAP", name: "PSAP, Police, Fire, EMS", lvl: "Required" },
  { id: "A45", name: "A4 / A5 Polygons", lvl: "Strongly rec." },
  { id: "SSAPoly", name: "SiteStructureAddressPolygon", lvl: "Recommended" },
  { id: "Marks", name: "Location / Distance markers", lvl: "Recommended" },
  { id: "RrHyd", name: "Rail and hydrology", lvl: "Recommended" },
];
function layerStatus(D) {
  const r = D.job.road_segments || 0;
  return {
    SSAP: ["filled", "in every Package"], RCL: r ? ["filled", fmt(r) + " segments"] : ["gap", "no road source yet"],
    A1: ["gap", "next: trivial"], A2: ["filled", D.packages.length + " polygons"], A3: ["filled", fmt(D.job.a3?.a3_polygons) + " polygons"],
    Prov: ["gap", "next: Package area"], PSAP: ["agency", "authority supplies"], A45: ["gap", "no source yet"],
    SSAPoly: ["gap", "planned"], Marks: ["gap", "planned"], RrHyd: ["gap", "planned"],
  };
}

/* ---------- data ---------- */
const DATA = {};
function weightedFill(D, key, rowsKey) {
  const out = {};
  let total = 0;
  for (const p of D.packages) {
    const ff = key(p) || {}, w = rowsKey(p) || 0;
    total += w;
    for (const [k, v] of Object.entries(ff)) if (v != null) out[k] = (out[k] || 0) + v * w;
  }
  for (const k in out) out[k] = total ? out[k] / total : 0;
  return out;
}
function decodePoints(P) {
  const feats = new Array(P.dx.length);
  let x = 0, y = 0;
  for (let i = 0; i < P.dx.length; i++) {
    x += P.dx[i]; y += P.dy[i];
    feats[i] = { type: "Feature", id: i, geometry: { type: "Point", coordinates: [x / 1e5, y / 1e5] }, properties: { k: P.kind[i], x: x / 1e5 } };
  }
  return { type: "FeatureCollection", features: feats };
}
function prepare(D) {
  D.ssapFill = weightedFill(D, p => p.field_fill, p => p.rows);
  D.rclFill = weightedFill(D, p => p.roads?.field_fill, p => p.roads?.rows);
  D.bbox = bboxOf(D.a2);
  D.openPoints = !!D.points;
  if (D.points) {
    D.pointsGeo = decodePoints(D.points);
    D.a2Order = D.points.a2s;
  }
  const up = D.job.upstream || {};
  D.up = { ov: up.overture || {}, nat: up.national || {} };
  return D;
}
function bboxOf(fc) {
  let b = [180, 90, -180, -90];
  const walk = c => { if (typeof c[0] === "number") { b[0] = Math.min(b[0], c[0]); b[1] = Math.min(b[1], c[1]); b[2] = Math.max(b[2], c[0]); b[3] = Math.max(b[3], c[1]); } else c.forEach(walk); };
  fc.features.forEach(f => walk(f.geometry.coordinates));
  return b;
}

/* ---------- chapters ---------- */
function chapters(D, P) {
  const j = D.job, unit = P.unit, units = unit === "county" ? "counties" : "census divisions";
  const recs = j.records, gers = j.records_with_gers_id, gap = j.gap_fill_candidates;
  const roads = j.road_segments || 0, roadsG = j.road_segments_with_gers_id || 0;
  const addrSrc = D.sources.filter(s => s.layer === "addresses");
  const roadSrc = D.sources.filter(s => s.layer === "centerlines");
  const lic = s => s.license_status === "open" ? "open licence" : s.license_status === "unknown" ? "licence not stated yet" : s.license_status;
  const dropped = Object.values(j.agency_points_dropped || {}).reduce((a, b) => a + b, 0);
  const choro = (label, fn, color) => ({ label, fn, color });
  return [
    { key: "sources", step: "Sources", tag: "Inputs", tagc: C.a2,
      title: `${P.name}: one open build, ${D.packages.length} ${units}`,
      body: [`The pipeline reads what government agencies already publish and builds a NENA NG9-1-1 GIS dataset for every ${unit}. Nothing is digitized by hand.`,
        `Address points: ${addrSrc.map(s => `<b>${esc(s.agency)}</b> (${lic(s)})`).join(", ")}. ` +
        (roadSrc.length ? `Roads: ${roadSrc.map(s => `<b>${esc(s.agency)}</b> (${lic(s)})`).join(", ")}. ` : "No government road layer is read for this pilot yet. ") +
        `Boundaries: ${esc(D.boundaries?.A2Polygon?.source || "")}. GERS IDs: Overture release ${esc(j.overture_release)}.`],

function fit(D, pad) {

function applyMap(ch, D) {
  const m = ch.map || {};

  // boundaries
  map.setPaintProperty("a2-line", "line-opacity", m.a2 === "draw" ? 0 : 0.55);
  if (m.a2 === "draw") tween(1400, k => map.setPaintProperty("a2-line", "line-opacity", 0.15 + 0.75 * k), () => map.setPaintProperty("a2-line", "line-width", 1.4));
  map.setPaintProperty("a3-line", "line-opacity", m.a3 ? 0.9 : 0.18);
  map.setPaintProperty("a3-fill", "fill-opacity", m.a3 ? 0.08 : 0);
  map.setFilter("a2-hi", ["==", ["get", "geoid"], ""]);
  // choropleth
  if (m.choro) {
    const vals = D.packages.map(p => +m.choro.fn(p) || 0), max = Math.max(...vals, 1e-9);
    D.packages.forEach((p, i) => map.setFeatureState({ source: "a2", id: p.package.split("-").pop() }, { v: vals[i] / max }));
    map.setPaintProperty("a2-choro", "fill-color", ["interpolate", ["linear"], ["coalesce", ["feature-state", "v"], 0], 0, "#14262d", 1, m.choro.color]);
    tween(900, k => map.setPaintProperty("a2-choro", "fill-opacity", 0.85 * k));

    if (show === "agencyonly") map.setFilter("pts", ["==", ["get", "k"], 1]);
    map.setPaintProperty("pts", "circle-opacity", show ? (show === "gap" ? 0.25 : 0.85) : 0.12);
    map.setPaintProperty("pts-gap", "circle-opacity", show === "gap" ? 0.95 : 0);

        () => map.setFilter("pts", ["!=", ["get", "k"], 2]));

    D.packages.forEach((p, i) => later(() => map.setFilter("a2-hi", ["==", ["get", "geoid"], p.package.split("-").pop()]), 400 + i * Math.min(900, 5200 / D.packages.length)));
  }
}

}
function play() { state.playing = true; $("playicon").innerHTML = '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>'; $("play").setAttribute("aria-label", "Pause"); go(state.i >= state.chs.length - 1 ? 0 : state.i); }
function stop() { state.playing = false; $("playicon").innerHTML = '<path d="M4 2v12l10-6z"/>'; $("play").setAttribute("aria-label", "Play the story"); const bar = $("steps").querySelector(".cur .p"); if (bar) bar.style.width = "0"; }
$("play").onclick = () => (state.playing ? (stop(), clearAnim()) : play());
$("prev").onclick = () => { stop(); go(state.i - 1); };
$("next").onclick = () => { stop(); go(state.i + 1); };
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea")) return;
  if (e.key === "ArrowRight") { stop(); go(state.i + 1); }
  if (e.key === "ArrowLeft") { stop(); go(state.i - 1); }
  if (e.key === " ") { e.preventDefault(); $("play").click(); }
});

/* ---------- popups ---------- */
let popup = null;
function closePopup() { if (popup) { popup.el.remove(); popup = null; } }
function placePopup() { const p = map.project(popup.ll); popup.el.style.left = p.x + "px"; popup.el.style.top = p.y + "px"; }
function openPopup(ll, html) {
  closePopup();
  const el = document.createElement("div"); el.className = "pop"; el.innerHTML = `<button class="x" aria-label="Close">×</button>${html}`;
  el.querySelector(".x").onclick = closePopup;
  $("map").appendChild(el); popup = { el, ll }; placePopup();
}
map.on("click", e => {
  const D = state.D; if (!D) return;
  const layers = ["pts-gap", "pts"].filter(l => map.getLayer(l) && map.getPaintProperty(l, "circle-opacity") > 0.2);
  const f = layers.length ? map.queryRenderedFeatures([[e.point.x - 5, e.point.y - 5], [e.point.x + 5, e.point.y + 5]], { layers })[0] : null;
  if (f) {
    const P = D.points, i = f.id, k = P.kind[i];
    const tag = k === 2 ? ["Overture gap-fill candidate", C.gap] : k === 0 ? ["Record · has a GERS ID", C.gers] : ["Record · agency only", C.ssap];
    const near = P.samples.find(s => Math.abs(s.lon - f.geometry.coordinates[0]) < 2e-5 && Math.abs(s.lat - f.geometry.coordinates[1]) < 2e-5);
    const extra = near ? `<dt>Address UID</dt><dd>${esc(near.uid)}</dd><dt>NGUID</dt><dd>${esc(near.nguid)}</dd><dt>GERS ID</dt><dd>${esc(near.gers_id || "–")}</dd>` : "";
    openPopup(f.geometry.coordinates, `<span class="tag" style="--c:${tag[1]}">${tag[0]}</span><h5>${esc((P.num[i] || "") + " " + P.streets[P.street[i]])}</h5>
      <dl><dt>A3</dt><dd>${esc(P.a3s[P.a3[i]] || "–")}</dd><dt>A2</dt><dd>${esc(P.a2s[P.a2[i]])}</dd>${extra}</dl>`);
    return;
  }
  const a = map.queryRenderedFeatures(e.point, { layers: ["a2-choro"] })[0];
  if (a) {
    const p = D.packages.find(p => p.package.endsWith("-" + a.properties.geoid));
    if (!p) return;
    openPopup([e.lngLat.lng, e.lngLat.lat], `<span class="tag" style="--c:${C.a2}">Package ${esc(p.package)}</span><h5>${esc(p.name)}</h5><dl>
      <dt>Records</dt><dd>${fmt(p.records)}</dd><dt>GERS IDs</dt><dd>${p.record_gers_coverage != null ? Math.round(p.record_gers_coverage * 100) + "%" : "–"}</dd>
      <dt>Gap-fill</dt><dd>${fmt(p.gap_fill_candidates)}</dd><dt>A3 polygons</dt><dd>${fmt(p.a3_features)}</dd>
      <dt>Road segs</dt><dd>${fmt(p.roads.rows)}</dd>${p.upstream?.national?.not_in_national_km != null ? `<dt>Not in TIGER</dt><dd>${fmt(Math.round(p.upstream.national.not_in_national_km))} km</dd>` : ""}
      <dt>NGUID domain</dt><dd>${esc(p.nguid_domain)}</dd></dl>`);
  }
});
map.on("mousemove", e => {
  const l = ["pts", "pts-gap", "a2-choro"].filter(x => map.getLayer(x));
  map.getCanvas().style.cursor = l.length && map.queryRenderedFeatures(e.point, { layers: l }).length ? "pointer" : "";
});

/* ---------- pilots ---------- */
function renderPilots() {
  $("pilots").innerHTML = PILOTS.map(P => {
    const D = DATA[P.job];
    return `<button data-job="${P.job}" aria-pressed="${state.pilot?.job === P.job}" data-open="${D?.points ? 1 : 0}" ${D ? "" : "disabled"} title="${P.name}${D ? ": " + fmt(D.job.records) + " Records" : ""}">
      <span class="dot"></span>${P.label}<span style="color:var(--faint)">${D ? fmt(D.job.records) : "…"}</span></button>`;
  }).join("");
  $("pilots").querySelectorAll("button").forEach(b => b.onclick = () => selectPilot(b.dataset.job, true));
}
function selectPilot(job, animate) {
  const P = PILOTS.find(p => p.job === job), D = DATA[job];
  if (!D) return;
  const wasPlaying = state.playing;
  stop(); clearAnim(); closePopup();
  state.pilot = P; state.D = D; state.chs = chapters(D, P);
  setSources(D); fit(D, animate);
  try { localStorage.setItem("story-pilot", job); } catch (e) { /* storage unavailable */ }
  renderPilots();
  state.i = Math.min(state.i, state.chs.length - 1);
  if (wasPlaying) play(); else go(state.i);
}

async function load(job) {
  const r = await fetch(`pilots/${job}.json`);
  if (!r.ok) throw new Error(job + ": " + r.status);
  DATA[job] = prepare(await r.json());
}
map.on("load", async () => {
  let first = "ca-pe";
  try { const s = localStorage.getItem("story-pilot"); if (s && PILOTS.some(p => p.job === s)) first = s; } catch (e) { /* storage unavailable */ }
  try {
    await load(first);
    selectPilot(first, false);
    $("loading").classList.add("gone");
    await Promise.all(PILOTS.filter(p => p.job !== first).map(p => load(p.job).catch(err => console.warn(err))));
    renderPilots();
  } catch (err) {
    $("loading").textContent = "The pilot data didn't load (" + err.message + "). Reload the page to try again.";
  }
});
window.addEventListener("resize", () => state.D && fit(state.D, false));
</script>
