# Jurisdiction registry: North Dakota (job us-nd)
#
# Who the Packages are for, which Source agencies' layers go into them, and where each agency stands.
# Statuses here change by hand, and only after the agency confirms (ADR 0004, 0005).

job = "us-nd"
packages = "county"        # one Package per county (TIGER), 53 in North Dakota

# 911 authorities: not named yet. North Dakota's PSAPs are run by counties and cities, and the statewide
# NG9-1-1 GIS layer is published by the state GIS Hub; which body receives the Packages is still to confirm,
# so no Recipient is guessed here (ADR 0004). Packages build with the placeholder domain and no recipient.

[[source]]
key = "us-nd-gishub-ssap"
agency = "North Dakota GIS Hub (NG9-1-1 Site/Structure Address Points)"
layer = "addresses"
covers = "*"
openaddresses = "us/nd/statewide"    # sources/us/nd/statewide.json
oa_layer = "state"
# Site_NGUID: filled on every point (438,365, checked 2026-11-26); LOCAL_ID is mostly blank.
id_field = "Site_NGUID"
# Place_Type is blank on most points and has no equipment-only values; the conform maps no addrtype.
exclude_site_types = []
# The layer states no license: stays out of anything published openly.
license_status = "unknown"
license_url = "https://gishubdata-ndgov.hub.arcgis.com/datasets/GOcSXpzwBHyk2nog::ndgishub-site-structure-address-points/about"
attribution = "North Dakota GIS Hub"

[source.sharing]
nad = "not_started"
overture = "not_started"
esri_community_maps = "not_applicable"
