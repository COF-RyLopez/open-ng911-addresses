# Jurisdiction registry: Vermont (job us-vt)
#
# Who the Packages are for, which Source agencies' layers go into them, and where each agency stands.
# Statuses here change by hand, and only after the agency confirms (ADR 0004, 0005).

job = "us-vt"
packages = "county"        # one Package per county (TIGER), 14 in Vermont

# 911 authorities: the Recipients. Vermont runs 9-1-1 statewide, so one authority covers every Package.
[[authority]]
key = "vt-e911-board"
name = "Vermont Enhanced 9-1-1 Board"
covers = "*"               # county GEOIDs, or "*" for every Package in the job
opted_in = false
# Set only after someone confirms from an address on this domain (ADR 0004). Until then every NGUID in the
# job uses the placeholder <package>.unclaimed.invalid.
domain = ""

# Source agencies' layers, read through the OpenAddresses source registry.
[[source]]
key = "us-vt-e911-esite"
agency = "Vermont Enhanced 9-1-1 Board (published by VCGI)"
layer = "addresses"
covers = "*"
openaddresses = "us/vt/statewide"    # sources/us/vt/statewide.json
oa_layer = "state"
# The layer's own stable ID. OpenAddresses maps no id for this source, so it is named here. If the field is
# missing from the service the build warns and mints UIDs instead (see ids.py).
id_field = "ESITEID"
# Nothing is excluded. Public telephones, utility poles with phones, call boxes and communication boxes carry a
# civic address in the E911 layer and are valid SiteStructureAddressPoints (NENA-STA-006.3 SSAP is any
# addressed site, and a fixed phone's location is what the LVF validates). Their SITETYPE rides along as
# source_site_type so an agency can tell them apart. Use this list only for points that aren't addressed sites.
exclude_site_types = []
# open | share-alike | unknown. "unknown" keeps the source out of anything published openly (plan, Licensing).
license_status = "unknown"
license_url = "https://vcgi.vermont.gov/sites/vcgi/files/warehouse/VCGI_Warranty_Copyright_Notice_2013.pdf"
attribution = "VT Enhanced 911 Board, VCGI"

# Sharing paths (ADR 0005): not_started | offered | in_progress | done | not_applicable
[source.sharing]
nad = "not_started"
overture = "not_started"           # addresses reach Overture through OpenAddresses
esri_community_maps = "not_applicable"

# NENA fields straight from the layer's own fields (fieldmap.py), beside the OpenAddresses conform above. Checked
# 2026-11-26 on all 353,161 points: HOUSE_NUMBER, SN, ESN, ZIP, SITETYPE and UPDATEDATE on every point; ST
# 324,247; PD 16,717; SD 8,294; HOUSE_NUMBERSUFFIX 797; HOUSE_NUMBERPREFIX 676; PT none. The layer has no unit,
# postal community or MSAG community name (TOWNNAME is the town, which A3 carries; MCODE is a town code), and no
# placement method.
[source.nena]
addnum_pre = "HOUSE_NUMBERPREFIX"
add_number = "HOUSE_NUMBER"
addnum_suf = "HOUSE_NUMBERSUFFIX"
st_predir = "PD"
st_pretyp = "PT"
st_name = "SN"
st_postyp = "ST"
st_posdir = "SD"
esn = "ESN"
post_code = "ZIP"
dateupdate = "UPDATEDATE"

# SITETYPE -> Place_Type (IANA Location Types). Only types with a clear equivalent; the rest (accessory
# buildings, commercial, development sites ...) stay empty, and every point keeps its SITETYPE as source_site_type.
[source.nena.place_type]
function = "map"
field = "SITETYPE"
else = ""
[source.nena.place_type.mapping]
"SINGLE FAMILY DWELLING" = "residence"
"MOBILE HOME" = "residence"
"CAMP" = "residence"
"MULTI-FAMILY DWELLING" = "residence"
"CONDOMINIUM" = "residence"
"OTHER RESIDENTIAL" = "residence"
"SEASONAL HOME" = "residence"
"RESIDENTIAL FARM" = "residence"
"LODGING B&B / HOTEL / MOTEL / INN" = "hotel"
"HOUSE OF WORSHIP" = "place-of-worship"
"RETAIL FACILITY" = "store"
"GROCERY STORE" = "store"
"PHARMACY" = "store"
"CAMPGROUND" = "campground"
"OFFICE BUILDING" = "office"
"INDUSTRIAL" = "industrial"
"MANUFACTURING FACILITY" = "industrial"
"SCHOOL K / 12" = "school"
"RESTAURANT" = "restaurant"
"GOVERNMENT" = "government"
"STATE GOVERNMENT FACILITY" = "government"
"US GOVERNMENT FACILITY" = "government"
"HEALTH CLINIC" = "hospital"
"HOSPITAL / MEDICAL CENTER" = "hospital"
"OUTPATIENT CLINIC" = "hospital"
"NURSING HOME / LONG TERM CARE" = "care-facility"
"PUBLIC TELEPHONE" = "phone-box"
"UTILITY POLE W/PHONE" = "phone-box"
"COMMUNICATION BOX" = "utilitybox"
"FIRE STATION" = "fire-station"
"POST OFFICE" = "post-office"
"LIBRARY" = "library"
"MUSEUM" = "museum"
"WAREHOUSE" = "warehouse"
"BANK" = "bank"
"CITY / TOWN HALL" = "town-hall"
"TOWN OFFICE" = "town-hall"
"TOWN GARAGE" = "municipal-garage"
"PRISON / CORRECTIONAL FACILITY" = "prison"
"BUS STATION / DISPATCH FACILITY" = "bus-station"
"RAILROAD STATION" = "train-station"
"SPORTS ARENA / STADIUM" = "stadium"
"AUDITORIUM / CONCERT HALL / THEATER / OPERA HOUSE" = "theater"
"YOUTH CAMP" = "youth-camp"
"TRANSFER STATION" = "waste-transfer-facility"
"PARK AND RIDE / COMMUTER LOT" = "parking"
"TRAILHEAD" = "outdoors"
"PICNIC AREA" = "outdoors"
"STATE PARK" = "outdoors"
"PUBLIC BEACH" = "outdoors"
"OTHER" = "other"

# Road centerlines: the E911 Board's own road layer, read through OpenAddresses' us/vt/statewide `centerlines`
# layer (we proposed it there: openaddresses/openaddresses#10178). Every Vermont Package is covered, so
# none falls back to TIGER.
[[source]]
key = "us-vt-e911-rds"
agency = "Vermont Enhanced 9-1-1 Board (published by VCGI)"
layer = "centerlines"
covers = "*"
openaddresses = "us/vt/statewide"
oa_layer = "state"
license_status = "unknown"          # same VCGI warranty notice as the address points; no license stated
license_url = "https://vcgi.vermont.gov/sites/vcgi/files/warehouse/VCGI_Warranty_Copyright_Notice_2013.pdf"
attribution = "VT Enhanced 911 Board, VCGI"
# AOTCLASS values that aren't roads a 911 call can be routed along: 65 ferry, 80-89 proposed, 96 discontinued,
# 98 not a road (VCGI metadata, EmergencyE911_RDS)
exclude = { field = "AOTCLASS", values = ["65", "80", "81", "82", "83", "84", "85", "86", "87", "88", "89", "96", "98"] }

# NENA fields straight from the road layer's own fields. Left/right ESN (LESN, RESN), town (LTWN, RTWN) and ZIP
# are on every segment (2,000-segment sample, 2026-11-26); PARITYLEFT/RIGHT and SPEEDLIMIT are empty.
[source.nena]
st_predir = "PD"
st_pretyp = "PT"
st_name = "SN"
st_postyp = "ST"
st_posdir = "SD"
esn_l = "LESN"
esn_r = "RESN"
a3_l = "LTWN"
a3_r = "RTWN"
postcode_l = "LZIP"
postcode_r = "RZIP"
dateupdate = "UPDATEDATE"
# RoadClass and OneWay in NENA's own words from AOTCLASS and ONEWAY, so they don't pass through the coarser
# OpenAddresses words above. AOTCLASS 71, 91, 93, 95 and 99 (class unknown) have no NENA word: left empty, counted.
roadclass = { function = "map", field = "AOTCLASS", mapping = { "1" = "Local", "2" = "Local", "3" = "Local", "4" = "Local", "5" = "Local", "6" = "Local", "7" = "Vehicular Trail", "8" = "Private", "9" = "Private", "10" = "Private", "11" = "Local", "12" = "Local", "13" = "Local", "14" = "Local", "15" = "Ramp", "16" = "Local", "20" = "Local", "21" = "Local", "22" = "Local", "23" = "Local", "24" = "Local", "25" = "Ramp", "30" = "Secondary", "31" = "Secondary", "32" = "Secondary", "33" = "Secondary", "34" = "Secondary", "35" = "Ramp", "40" = "Secondary", "41" = "Secondary", "42" = "Secondary", "43" = "Secondary", "44" = "Secondary", "45" = "Ramp", "46" = "Secondary", "47" = "Other", "50" = "Primary", "51" = "Primary", "52" = "Primary", "53" = "Primary", "54" = "Primary", "55" = "Ramp", "56" = "Primary", "57" = "Other", "59" = "Primary", "70" = "Vehicular Trail", "92" = "Other", "97" = "Private" } }
oneway = { function = "map", field = "ONEWAY", mapping = { Y = "FT", X = "TF", N = "B" } }

# Service boundaries from the E911 Board's Emergency Service Zones (VCGI EmergencyE911_ESZ, 479 zones). Each zone
# names its PSAP and its fire, law and EMS agency, so the zones merged by each name give the four layers (layers.py
# `dissolve`). The names are the Board's display names; Agency_ID, ServiceURI and AVcard_URI aren't published, so
# they stay empty for the authority to fill (ADR 0004). Same VCGI notice as the points: licence unknown.
[[source]]
key = "us-vt-e911-esz-psap"
agency = "Vermont Enhanced 9-1-1 Board (published by VCGI)"
layer = "psap"
covers = "*"
dissolve = "PSAP_DisplayName"
endpoint = { data = "https://services1.arcgis.com/BkFxaEFNwHqX3tAw/arcgis/rest/services/FS_VCGI_OPENDATA_Emergency_ESZ_poly_SP_v1/FeatureServer/0", protocol = "ESRI" }
license_status = "unknown"
license_url = "https://vcgi.vermont.gov/sites/vcgi/files/warehouse/VCGI_Warranty_Copyright_Notice_2013.pdf"
attribution = "VT Enhanced 911 Board, VCGI"
nena = { dsplayname = "PSAP_DisplayName", dateupdate = "UPDATEDATE" }

