# Jurisdiction registry: Vermont (job us-vt)
#
# Who the Packages are for, which Source agencies' layers go into them, and where each agency stands.
# Statuses here change by hand, and only after the agency confirms (ADR 0004, 0005).

job = "us-vt"
packages = "county"        # one Package per county (TIGER), 14 in Vermont

# 911 authorities: the Recipients. Vermont runs 9-1-1 statewide, so one authority covers every Package.
[[authority]]
key = "vt-e911-board"
name = "Vermont Enhanced 9-1-1 Board"
covers = "*"               # county GEOIDs, or "*" for every Package in the job
opted_in = false
# Set only after someone confirms from an address on this domain (ADR 0004). Until then every NGUID in the
# job uses the placeholder <package>.unclaimed.invalid.
domain = ""

# Source agencies' layers, read through the OpenAddresses source registry.
[[source]]
key = "us-vt-e911-esite"
agency = "Vermont Enhanced 9-1-1 Board (published by VCGI)"
layer = "addresses"
covers = "*"
openaddresses = "us/vt/statewide"    # sources/us/vt/statewide.json
oa_layer = "state"
# The layer's own stable ID. OpenAddresses maps no id for this source, so it is named here. If the field is
# missing from the service the build warns and mints UIDs instead (see ids.py).
id_field = "ESITEID"
# E911 sites include hydrants and public phones: keep the site types that are addresses. Empty keeps all.
exclude_site_types = ["HYDRANT", "PUBLIC PHONE", "PAY PHONE"]   # values to confirm against the live layer
# open | share-alike | unknown. "unknown" keeps the source out of anything published openly (plan, Licensing).
license_status = "unknown"
license_url = "https://vcgi.vermont.gov/sites/vcgi/files/warehouse/VCGI_Warranty_Copyright_Notice_2013.pdf"
attribution = "VT Enhanced 911 Board, VCGI"

# Sharing paths (ADR 0005): not_started | offered | in_progress | done | not_applicable
[source.sharing]
nad = "not_started"
overture = "not_started"           # addresses reach Overture through OpenAddresses
esri_community_maps = "not_applicable"
