ask = "Whether the E911 road centerlines can be shared under the same public terms as the address points, or with the Bureau as the recipient of its own Package only."
contact = "https://www.maine.gov/mpuc/emergency-services-communication"
status = "found"
last_checked = "2026-11-26"

