ask = "Which licence applies to the NG9-1-1 road centerlines and the fire and law enforcement boundaries, and whether PSAP and EMS response-area boundaries are published."
contact = "https://gishubdata-ndgov.hub.arcgis.com/"
status = "found"
last_checked = "2026-11-26"

[[request]]
key = "us-ut-ugrc-ng911"
job = "us-ut"
publisher = "Utah Geospatial Resource Center (UGRC), for the Utah 911 Committee and DPS"
layers = ["centerlines", "psap", "police", "fire", "ems"]
sources = ["us/ut/statewide (centerlines, UtahRoads)", "UtahPSAP_Boundaries", "LawEnforcementBoundaries", "FireResponseAreas", "EMSServiceAreas (not read: last edited 2021)"]
issue = "unstated"
found = "The address points are CC BY 4.0 (OpenAddresses), but the roads record no licence in OpenAddresses and the PSAP, law and fire layers carry only an 'as is' disclaimer (checked 2026-11-26). Utah's EMS service areas were last edited in 2021 and have no NENA fields."
evidence = "https://opendata.gis.utah.gov/"
ask = "Whether the CC BY 4.0 terms of the address points also cover the road centerlines and the PSAP, law and fire boundaries, and which layer is the current EMS response-area boundary."
contact = "https://gis.utah.gov/"
status = "found"
last_checked = "2026-11-26"

[[request]]
