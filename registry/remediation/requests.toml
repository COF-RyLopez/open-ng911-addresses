# License remediation worklist (docs/license-remediation.md). Edited by hand.
#
# One [[request]] per source or jurisdiction we would like to ask about. This file records what we found on public
# pages and what we would ask. It never says what an agency allows until the agency has answered in writing
# (ADR 0004). A person sends every request; no agent contacts an agency.
#
# issue:  unstated | presumed | stated_unreviewed | share_alike | restricted | no_source
# status: found | ready | asked | answered | resolved | declined
# contact: a public contact page, never a personal address.

[[request]]
key = "us-vt-e911-sites"
job = "us-vt"
publisher = "VCGI, for the Vermont Enhanced 9-1-1 Board"
layers = ["addresses", "centerlines", "psap", "police", "fire", "ems"]
sources = ["us/vt/statewide (addresses)", "VCGI EmergencyE911_RDS (centerlines, PR #5 oa_entry)", "VCGI EmergencyE911_ESZ (emergency service zones: PSAP, law, fire and EMS display names)"]
issue = "stated_unreviewed"
found = "The only licence text is VCGI's 2013 warranty and copyright notice, which disclaims warranty but grants no reuse terms we can read as open."
evidence = "https://vcgi.vermont.gov/sites/vcgi/files/warehouse/VCGI_Warranty_Copyright_Notice_2013.pdf"
ask = "Whether the E911 site points, road centerlines and emergency service zones may be redistributed, with attribution, under an open licence (for example CC BY 4.0 or public domain). For the opted-in Package: the Agency_ID, ServiceURI and AVcard_URI of each PSAP, law, fire and EMS agency the zones name (not published)."
contact = "https://vcgi.vermont.gov/"
status = "found"
last_checked = "2026-11-26"

