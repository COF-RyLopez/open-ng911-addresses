[[request]]
key = "us-nd-ng911-layers"
job = "us-nd"
publisher = "North Dakota GIS Hub (NG9-1-1 road centerlines, fire and law enforcement boundaries, road mile markers)"
layers = ["centerlines", "fire", "police", "distance_markers"]
sources = ["NDGISHUBRoadsNG911", "NDGISHUB_Fire_Boundary", "NDGISHUB_Law_Enforcement_Boundary", "NDGISHUB_Road_Mile_Markers"]
issue = "unstated"
found = "Each layer carries the State's cartographic disclaimer and no licence (checked 2026-11-26). No PSAP boundary layer was found on the Hub, and its EMS layer is the Health Department's four regions."
