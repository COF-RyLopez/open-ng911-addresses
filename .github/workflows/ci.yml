name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv pip install --system -e ".[dev]"
      # portolan-cli validates the catalog in tests/test_catalog.py; it pins duckdb<1.6, so it gets its own env
      - run: uv tool install "portolan-cli>=0.9"
      - run: echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - run: ruff check src tests
      - run: pytest -q -m "not live"  # offline; live checks run in the build job

  plan:
    name: List enabled jobs
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.jobs.outputs.jobs }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: jobs
        run: echo "jobs=$(PYTHONPATH=src python -m open_ng911.jobs)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.job }}
    needs: [test, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false  # one state's source outage must not cancel the others
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv pip install --system -e ".[export]"
      # Overture release: latest from STAC/S3 unless OVERTURE_RELEASE is set (overture_release.py)
      - run: python -m open_ng911.build --job ${{ matrix.job }} --out data/output
      # Live checks of the outside sources no enabled job reaches yet (TIGER ADDRFEAT, the road fallback)
      - run: uv pip install --system pytest && pytest -q -m live
      # The Portolan catalog over this job's Packages (catalog.py): only open-licensed, opted-in Packages carry
      # data in it; report.json says why each other Package is withheld.
      - run: python -m open_ng911.catalog --out data/output --catalog data/catalog
      # The job as one NENA GeoPackage (export.py). Its report lists values too long for NENA's fields or outside
      # NENA's domains, and the fields each agency still owes. A too-long value fails this step without failing the
      # build: it is the agency's data to fix, and the report says where.
      - id: export
        continue-on-error: true
        run: python -m open_ng911.export data/output/release=*/${{ matrix.job }} data/output/${{ matrix.job }}.gpkg
      # Why the duplicate and road-range checks fail, against the Source's own fields (scenarios.py): one line, last
      # in the log, so it can be read without the artifact
      - if: always()
        run: python -m open_ng911.scenarios data/output/release=*/${{ matrix.job }}/job.json
      # Only the summaries are uploaded. Package data carries sources whose license is still "unknown" and
      # isn't handed out until an authority opts in (ADR 0003), so it never goes into a public artifact.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-${{ matrix.job }}
          path: |
            data/output/release=*/${{ matrix.job }}/job.json
            data/output/release=*/${{ matrix.job }}/*/manifest.json
            data/catalog/report.json
            data/output/${{ matrix.job }}.gpkg.report.json
          if-no-files-found: warn
